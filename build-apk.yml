name: Build Tahadiyat Hassan APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Install Android components
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          mkdir project
          unzip -q "$ZIP_FILE" -d project

      - name: Find Android project
        run: |
          ANDROID_DIR=$(dirname "$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          gradle -p "$ANDROID_DIR" assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output
          find project -type f -name "*.apk" -exec cp {} output/ \;
          test -n "$(ls -A output)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahadiyat-Hassan-APK
          path: output/*.apk
