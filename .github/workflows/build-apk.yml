name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract game files
        run: |
          unzip -o Tahadiyat_Hassan_Full.zip -d project

      - name: Find Gradle project
        run: |
          find project -name gradlew -type f

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahadiyat-Hassan-APK
          path: project/**/build/outputs/apk/debug/*.apk
